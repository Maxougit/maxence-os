<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="2400" height="1240" role="img" aria-labelledby="title desc">
  <title id="title">Quotes Automation pipeline</title>
  <desc id="desc">A quote request received by email flows through eight micro-services chained by a message bus, from intake to the creation of the quote in SAP and the reply to the customer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10131d"/>
      <stop offset="1" stop-color="#171b2a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="30" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="150" fill="#0a84ff" opacity=".07"/>
  <circle cx="90" cy="570" r="180" fill="#ff9f0a" opacity=".05"/>

  <text x="56" y="60" fill="#f7f8fc" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Quotes Automation — quote pipeline</text>
  <text x="56" y="89" fill="#99a2b8" font-family="system-ui, sans-serif" font-size="15">A customer email comes in, a SAP quote goes out: eight micro-services chained by a message bus</text>

  <g font-family="system-ui, sans-serif" filter="url(#shadow)">
    <!-- Row 1 -->
    <g>
      <rect x="58" y="128" width="250" height="92" rx="16" fill="#202637" stroke="#343c51"/>
      <circle cx="86" cy="156" r="13" fill="#0a84ff" opacity=".22"/>
      <text x="86" y="161" fill="#8ec5ff" font-size="13" font-weight="700" text-anchor="middle">1</text>
      <text x="108" y="161" fill="#f7f8fc" font-size="14.5" font-weight="700">Email intake</text>
      <text x="76" y="187" fill="#aeb7ca" font-size="11.5">Office 365 · sender filtering</text>
      <text x="76" y="205" fill="#aeb7ca" font-size="11.5">every request archived</text>
    </g>
    <g>
      <rect x="336" y="128" width="250" height="92" rx="16" fill="#202637" stroke="#343c51"/>
      <circle cx="364" cy="156" r="13" fill="#0a84ff" opacity=".22"/>
      <text x="364" y="161" fill="#8ec5ff" font-size="13" font-weight="700" text-anchor="middle">2</text>
      <text x="386" y="161" fill="#f7f8fc" font-size="14.5" font-weight="700">Customer lookup</text>
      <text x="354" y="187" fill="#aeb7ca" font-size="11.5">matched to the account</text>
      <text x="354" y="205" fill="#aeb7ca" font-size="11.5">and the sales branch</text>
    </g>
    <g>
      <rect x="614" y="128" width="250" height="92" rx="16" fill="#202637" stroke="#343c51"/>
      <circle cx="642" cy="156" r="13" fill="#0a84ff" opacity=".22"/>
      <text x="642" y="161" fill="#8ec5ff" font-size="13" font-weight="700" text-anchor="middle">3</text>
      <text x="664" y="161" fill="#f7f8fc" font-size="14.5" font-weight="700">Attachments</text>
      <text x="632" y="187" fill="#aeb7ca" font-size="11.5">text extracted by OCR</text>
      <text x="632" y="205" fill="#aeb7ca" font-size="11.5">(PDF, images, documents)</text>
    </g>
    <g>
      <rect x="892" y="128" width="250" height="92" rx="16" fill="#202637" stroke="#343c51"/>
      <circle cx="920" cy="156" r="13" fill="#bf5af2" opacity=".24"/>
      <text x="920" y="161" fill="#d88cff" font-size="13" font-weight="700" text-anchor="middle">4</text>
      <text x="942" y="161" fill="#f7f8fc" font-size="14.5" font-weight="700">Product search</text>
      <text x="910" y="187" fill="#aeb7ca" font-size="11.5">search index + generative AI</text>
      <text x="910" y="205" fill="#aeb7ca" font-size="11.5">to find the right reference</text>
    </g>

    <!-- Row 2 -->
    <g>
      <rect x="58" y="286" width="250" height="92" rx="16" fill="#202637" stroke="#343c51"/>
      <circle cx="86" cy="314" r="13" fill="#bf5af2" opacity=".24"/>
      <text x="86" y="319" fill="#d88cff" font-size="13" font-weight="700" text-anchor="middle">5</text>
      <text x="108" y="319" fill="#f7f8fc" font-size="14.5" font-weight="700">Process assessment</text>
      <text x="76" y="345" fill="#aeb7ca" font-size="11.5">processing rules:</text>
      <text x="76" y="363" fill="#aeb7ca" font-size="11.5">cutting, drilling, finishing</text>
    </g>
    <g>
      <rect x="336" y="286" width="250" height="92" rx="16" fill="#202637" stroke="#343c51"/>
      <circle cx="364" cy="314" r="13" fill="#30d158" opacity=".24"/>
      <text x="364" y="319" fill="#5ee27a" font-size="13" font-weight="700" text-anchor="middle">6</text>
      <text x="386" y="319" fill="#f7f8fc" font-size="14.5" font-weight="700">Stock check</text>
      <text x="354" y="345" fill="#aeb7ca" font-size="11.5">availability, source site</text>
      <text x="354" y="363" fill="#aeb7ca" font-size="11.5">and delivery lead time</text>
    </g>
    <g>
      <rect x="614" y="286" width="250" height="92" rx="16" fill="#202637" stroke="#343c51"/>
      <circle cx="642" cy="314" r="13" fill="#ff9f0a" opacity=".24"/>
      <text x="642" y="319" fill="#ffb340" font-size="13" font-weight="700" text-anchor="middle">7</text>
      <text x="664" y="319" fill="#f7f8fc" font-size="14.5" font-weight="700">Quote creation</text>
      <text x="632" y="345" fill="#aeb7ca" font-size="11.5">written into SAP</text>
      <text x="632" y="363" fill="#aeb7ca" font-size="11.5">via the business APIs</text>
    </g>
    <g>
      <rect x="892" y="286" width="250" height="92" rx="16" fill="#202637" stroke="#343c51"/>
      <circle cx="920" cy="314" r="13" fill="#ff9f0a" opacity=".24"/>
      <text x="920" y="319" fill="#ffb340" font-size="13" font-weight="700" text-anchor="middle">8</text>
      <text x="942" y="319" fill="#f7f8fc" font-size="14.5" font-weight="700">Reply to customer</text>
      <text x="910" y="345" fill="#aeb7ca" font-size="11.5">quote sent by email</text>
      <text x="910" y="363" fill="#aeb7ca" font-size="11.5">to the rep and the customer</text>
    </g>
  </g>

  <!-- Pipeline arrows: each step publishes to the bus, the next one consumes -->
  <g stroke="#f97316" stroke-width="2.4" fill="none" opacity=".9">
    <path d="M308 174 H336" marker-end="url(#tip)"/>
    <path d="M586 174 H614" marker-end="url(#tip)"/>
    <path d="M864 174 H892" marker-end="url(#tip)"/>
    <path d="M1017 220 V250 Q1017 262 1005 262 H195 Q183 262 183 274 V286" marker-end="url(#tip)"/>
    <path d="M308 332 H336" marker-end="url(#tip)"/>
    <path d="M586 332 H614" marker-end="url(#tip)"/>
    <path d="M864 332 H892" marker-end="url(#tip)"/>
  </g>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 1l8 4-8 4z" fill="#f97316"/>
    </marker>
  </defs>
  <text x="600" y="256" fill="#f9a45c" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">RabbitMQ message bus between every step</text>

  <!-- Technical foundation -->
  <g font-family="system-ui, sans-serif" filter="url(#shadow)">
    <rect x="58" y="418" width="1084" height="152" rx="20" fill="#181e2d" stroke="#343c51"/>
    <text x="82" y="450" fill="#99a2b8" font-size="12.5" font-weight="700" letter-spacing="1.5">FOUNDATION — KUBERNETES CLUSTER (AKS)</text>

    <g>
      <rect x="82" y="466" width="242" height="84" rx="14" fill="#202637" stroke="#343c51"/>
      <text x="102" y="494" fill="#f7f8fc" font-size="13.5" font-weight="700">Data</text>
      <text x="102" y="516" fill="#aeb7ca" font-size="11.5">MongoDB · Redis</text>
      <text x="102" y="534" fill="#aeb7ca" font-size="11.5">Solr search index</text>
    </g>
    <g>
      <rect x="342" y="466" width="242" height="84" rx="14" fill="#202637" stroke="#343c51"/>
      <text x="362" y="494" fill="#f7f8fc" font-size="13.5" font-weight="700">Generative AI</text>
      <text x="362" y="516" fill="#aeb7ca" font-size="11.5">Azure OpenAI</text>
      <text x="362" y="534" fill="#aeb7ca" font-size="11.5">multi-LLM load balancer</text>
    </g>
    <g>
      <rect x="602" y="466" width="242" height="84" rx="14" fill="#202637" stroke="#343c51"/>
      <text x="622" y="494" fill="#f7f8fc" font-size="13.5" font-weight="700">Observability</text>
      <text x="622" y="516" fill="#aeb7ca" font-size="11.5">centralized logging</text>
      <text x="622" y="534" fill="#aeb7ca" font-size="11.5">dashboards and Power BI</text>
    </g>
    <g>
      <rect x="862" y="466" width="256" height="84" rx="14" fill="#202637" stroke="#343c51"/>
      <text x="882" y="494" fill="#f7f8fc" font-size="13.5" font-weight="700">Industrialization</text>
      <text x="882" y="516" fill="#aeb7ca" font-size="11.5">Docker containers · CI/CD</text>
      <text x="882" y="534" fill="#aeb7ca" font-size="11.5">deployed on AKS</text>
    </g>
  </g>
</svg>
