<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="2400" height="1240" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline de Quotes Automation</title>
  <desc id="desc">Une demande de devis reçue par e-mail traverse huit micro-services enchaînés par un bus de messages, de la réception jusqu'à la création du devis dans SAP et la réponse au client.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10131d"/>
      <stop offset="1" stop-color="#171b2a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="30" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="150" fill="#0a84ff" opacity=".07"/>
  <circle cx="90" cy="570" r="180" fill="#ff9f0a" opacity=".05"/>

  <text x="56" y="60" fill="#f7f8fc" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Quotes Automation — pipeline de devis</text>
  <text x="56" y="89" fill="#99a2b8" font-family="system-ui, sans-serif" font-size="15">Un e-mail client entre, un devis SAP sort : huit micro-services enchaînés par un bus de messages</text>

  <g font-family="system-ui, sans-serif" filter="url(#shadow)">
    <!-- Rangée 1 -->
    <g>
      <rect x="58" y="128" width="250" height="92" rx="16" fill="#202637" stroke="#343c51"/>
      <circle cx="86" cy="156" r="13" fill="#0a84ff" opacity=".22"/>
      <text x="86" y="161" fill="#8ec5ff" font-size="13" font-weight="700" text-anchor="middle">1</text>
      <text x="108" y="161" fill="#f7f8fc" font-size="14.5" font-weight="700">Réception des e-mails</text>
      <text x="76" y="187" fill="#aeb7ca" font-size="11.5">Office 365 · filtrage des expéditeurs</text>
      <text x="76" y="205" fill="#aeb7ca" font-size="11.5">archivage de chaque demande</text>
    </g>
    <g>
      <rect x="336" y="128" width="250" height="92" rx="16" fill="#202637" stroke="#343c51"/>
      <circle cx="364" cy="156" r="13" fill="#0a84ff" opacity=".22"/>
      <text x="364" y="161" fill="#8ec5ff" font-size="13" font-weight="700" text-anchor="middle">2</text>
      <text x="386" y="161" fill="#f7f8fc" font-size="14.5" font-weight="700">Identification du client</text>
      <text x="354" y="187" fill="#aeb7ca" font-size="11.5">rapprochement avec le compte</text>
      <text x="354" y="205" fill="#aeb7ca" font-size="11.5">et l'agence commerciale</text>
    </g>
    <g>
      <rect x="614" y="128" width="250" height="92" rx="16" fill="#202637" stroke="#343c51"/>
      <circle cx="642" cy="156" r="13" fill="#0a84ff" opacity=".22"/>
      <text x="642" y="161" fill="#8ec5ff" font-size="13" font-weight="700" text-anchor="middle">3</text>
      <text x="664" y="161" fill="#f7f8fc" font-size="14.5" font-weight="700">Pièces jointes</text>
      <text x="632" y="187" fill="#aeb7ca" font-size="11.5">extraction du texte par OCR</text>
      <text x="632" y="205" fill="#aeb7ca" font-size="11.5">(PDF, images, documents)</text>
    </g>
    <g>
      <rect x="892" y="128" width="250" height="92" rx="16" fill="#202637" stroke="#343c51"/>
      <circle cx="920" cy="156" r="13" fill="#bf5af2" opacity=".24"/>
      <text x="920" y="161" fill="#d88cff" font-size="13" font-weight="700" text-anchor="middle">4</text>
      <text x="942" y="161" fill="#f7f8fc" font-size="14.5" font-weight="700">Recherche produit</text>
      <text x="910" y="187" fill="#aeb7ca" font-size="11.5">moteur d'index + IA générative</text>
      <text x="910" y="205" fill="#aeb7ca" font-size="11.5">pour retrouver la référence</text>
    </g>

    <!-- Rangée 2 -->
    <g>
      <rect x="58" y="286" width="250" height="92" rx="16" fill="#202637" stroke="#343c51"/>
      <circle cx="86" cy="314" r="13" fill="#bf5af2" opacity=".24"/>
      <text x="86" y="319" fill="#d88cff" font-size="13" font-weight="700" text-anchor="middle">5</text>
      <text x="108" y="319" fill="#f7f8fc" font-size="14.5" font-weight="700">Évaluation process</text>
      <text x="76" y="345" fill="#aeb7ca" font-size="11.5">règles de transformation :</text>
      <text x="76" y="363" fill="#aeb7ca" font-size="11.5">coupe, perçage, finitions</text>
    </g>
    <g>
      <rect x="336" y="286" width="250" height="92" rx="16" fill="#202637" stroke="#343c51"/>
      <circle cx="364" cy="314" r="13" fill="#30d158" opacity=".24"/>
      <text x="364" y="319" fill="#5ee27a" font-size="13" font-weight="700" text-anchor="middle">6</text>
      <text x="386" y="319" fill="#f7f8fc" font-size="14.5" font-weight="700">Vérification du stock</text>
      <text x="354" y="345" fill="#aeb7ca" font-size="11.5">disponibilité, site source</text>
      <text x="354" y="363" fill="#aeb7ca" font-size="11.5">et délai de livraison</text>
    </g>
    <g>
      <rect x="614" y="286" width="250" height="92" rx="16" fill="#202637" stroke="#343c51"/>
      <circle cx="642" cy="314" r="13" fill="#ff9f0a" opacity=".24"/>
      <text x="642" y="319" fill="#ffb340" font-size="13" font-weight="700" text-anchor="middle">7</text>
      <text x="664" y="319" fill="#f7f8fc" font-size="14.5" font-weight="700">Création du devis</text>
      <text x="632" y="345" fill="#aeb7ca" font-size="11.5">écriture dans SAP</text>
      <text x="632" y="363" fill="#aeb7ca" font-size="11.5">via les API métier</text>
    </g>
    <g>
      <rect x="892" y="286" width="250" height="92" rx="16" fill="#202637" stroke="#343c51"/>
      <circle cx="920" cy="314" r="13" fill="#ff9f0a" opacity=".24"/>
      <text x="920" y="319" fill="#ffb340" font-size="13" font-weight="700" text-anchor="middle">8</text>
      <text x="942" y="319" fill="#f7f8fc" font-size="14.5" font-weight="700">Réponse au client</text>
      <text x="910" y="345" fill="#aeb7ca" font-size="11.5">envoi du devis par e-mail</text>
      <text x="910" y="363" fill="#aeb7ca" font-size="11.5">au commercial et au client</text>
    </g>
  </g>

  <!-- Flèches du pipeline : chaque étape publie dans le bus, la suivante consomme -->
  <g stroke="#f97316" stroke-width="2.4" fill="none" opacity=".9">
    <path d="M308 174 H336" marker-end="url(#tip)"/>
    <path d="M586 174 H614" marker-end="url(#tip)"/>
    <path d="M864 174 H892" marker-end="url(#tip)"/>
    <path d="M1017 220 V250 Q1017 262 1005 262 H195 Q183 262 183 274 V286" marker-end="url(#tip)"/>
    <path d="M308 332 H336" marker-end="url(#tip)"/>
    <path d="M586 332 H614" marker-end="url(#tip)"/>
    <path d="M864 332 H892" marker-end="url(#tip)"/>
  </g>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 1l8 4-8 4z" fill="#f97316"/>
    </marker>
  </defs>
  <text x="600" y="256" fill="#f9a45c" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">bus de messages RabbitMQ entre chaque étape</text>

  <!-- Socle technique -->
  <g font-family="system-ui, sans-serif" filter="url(#shadow)">
    <rect x="58" y="418" width="1084" height="152" rx="20" fill="#181e2d" stroke="#343c51"/>
    <text x="82" y="450" fill="#99a2b8" font-size="12.5" font-weight="700" letter-spacing="1.5">SOCLE — CLUSTER KUBERNETES (AKS)</text>

    <g>
      <rect x="82" y="466" width="242" height="84" rx="14" fill="#202637" stroke="#343c51"/>
      <text x="102" y="494" fill="#f7f8fc" font-size="13.5" font-weight="700">Données</text>
      <text x="102" y="516" fill="#aeb7ca" font-size="11.5">MongoDB · Redis</text>
      <text x="102" y="534" fill="#aeb7ca" font-size="11.5">index de recherche Solr</text>
    </g>
    <g>
      <rect x="342" y="466" width="242" height="84" rx="14" fill="#202637" stroke="#343c51"/>
      <text x="362" y="494" fill="#f7f8fc" font-size="13.5" font-weight="700">IA générative</text>
      <text x="362" y="516" fill="#aeb7ca" font-size="11.5">Azure OpenAI</text>
      <text x="362" y="534" fill="#aeb7ca" font-size="11.5">load balancer multi-LLM</text>
    </g>
    <g>
      <rect x="602" y="466" width="242" height="84" rx="14" fill="#202637" stroke="#343c51"/>
      <text x="622" y="494" fill="#f7f8fc" font-size="13.5" font-weight="700">Observabilité</text>
      <text x="622" y="516" fill="#aeb7ca" font-size="11.5">journalisation centralisée</text>
      <text x="622" y="534" fill="#aeb7ca" font-size="11.5">tableaux de bord et Power BI</text>
    </g>
    <g>
      <rect x="862" y="466" width="256" height="84" rx="14" fill="#202637" stroke="#343c51"/>
      <text x="882" y="494" fill="#f7f8fc" font-size="13.5" font-weight="700">Industrialisation</text>
      <text x="882" y="516" fill="#aeb7ca" font-size="11.5">conteneurs Docker · CI/CD</text>
      <text x="882" y="534" fill="#aeb7ca" font-size="11.5">déploiement sur AKS</text>
    </g>
  </g>
</svg>
