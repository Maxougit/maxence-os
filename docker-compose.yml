x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  maxence-os:
    build:
      context: .
      dockerfile: Dockerfile
      # Les pages sont pré-rendues : Compose transmet au build les valeurs du .env du projet.
      args:
        NEXT_PUBLIC_MAXA_ANALYTICS_HOST: ${MAXA_ANALYTICS_HOST:-}
        NEXT_PUBLIC_MAXA_ANALYTICS_SITE_ID: ${MAXA_ANALYTICS_SITE_ID:-}
    restart: unless-stopped
    init: true
    logging: *default-logging
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "192.168.1.224:3001:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
